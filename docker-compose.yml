version: '3.8'
services:
  pd_reloaded:
    container_name: pd_reloaded
    build: .
    environment:
      - PGID=1000
      - PUID=1000
      - TZ=Africa/Johannesburg
    ports:
      - "8008:8008"
    restart: unless-stopped
    volumes:
      - ./config:/app/config:rw
      - /mnt:/mnt
      - ./settings.json:/app/settings.json:rw  # optional, for legacy migration
